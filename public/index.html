<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1416" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mijn Dashboard">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Mijn Dashboard</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Mijn Dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8M15 8h5v5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-name">Mijn Dashboard</span>
    </a>
    <nav id="sections" class="seg" hidden>
      <a href="#/" data-section="etf">ETF's</a>
      <a href="#/energy" data-section="energy">Energie</a>
    </nav>
    <span id="topbar-user" class="topbar-user"></span>
  </header>

  <main id="app" class="container" aria-live="polite">
    <div class="loading">Laden…</div>
  </main>

  <nav id="tabbar" class="tabbar" hidden>
    <a href="#/" data-tab="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z" fill="currentColor"/></svg>
      <span>Overzicht</span>
    </a>
    <a href="#/charts" data-tab="charts">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <span>Grafieken</span>
    </a>
    <a href="#/add" data-tab="add" class="tab-add">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>Aankoop</span>
    </a>
    <a href="#/purchases" data-tab="purchases">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Historiek</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Account</span>
    </a>
  </nav>

  <nav id="tabbar-energy" class="tabbar" hidden>
    <a href="#/energy" data-tab="e-overview">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <span>Overzicht</span>
    </a>
    <a href="#/energy/months" data-tab="e-months">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Maanden</span>
    </a>
    <a href="#/energy/add" data-tab="e-add" class="tab-add">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>Maand</span>
    </a>
    <a href="#/energy/tariffs" data-tab="e-tariffs">
      <svg viewBox="0 0 24 24"><path d="M15 6.5A6 6 0 1 0 15 17.5M4 10h9M4 14h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      <span>Tarieven</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Account</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
